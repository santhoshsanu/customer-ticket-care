services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ccuser
      POSTGRES_PASSWORD: ccpassword
      POSTGRES_DB: customer_care
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./customercaredb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccuser -d customer_care"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
